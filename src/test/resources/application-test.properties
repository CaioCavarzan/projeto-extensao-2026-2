# INCLUÍDO (20/10/2026): configuração dos testes automáticos (perfil "test", ativado por @ActiveProfiles("test")).
# Os testes rodam num banco H2 em memória criado a partir do script do grupo (schema-h2.sql), sem precisar do
# SQL Server ligado. O ddl-auto=validate do application.properties continua valendo: se uma entity divergir do
# script, os testes nem começam.
# ${random.uuid}: cada contexto de teste do Spring ganha o seu banco (senão o script rodaria duas vezes no mesmo banco).
spring.datasource.url=jdbc:h2:mem:fenix_${random.uuid};MODE=MSSQLServer;DATABASE_TO_UPPER=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql

# Fotos dos testes numa pasta temporária.
fenix.fotos.diretorio=${java.io.tmpdir}/fenix-fotos-teste
