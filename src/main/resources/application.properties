spring.application.name=projetoextensao

# create database banco_fenix
spring.jpa.open-in-view=true

# Configurações do banco de dados SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=banco_fenix;encrypt=true;trustServerCertificate=true;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=dbadba

# valida as tabelas do banco de dados
spring.jpa.hibernate.ddl-auto=validate

# reescreve os nomes em snake_case (OrdensDeServico vira ordens_de_servico), e 11 tabelas do script deixariam
# de ser encontradas.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Se você também estiver servindo páginas web, pode querer configurar o filtro de codificação de caracteres
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true

# ---------------------------------------------------------------------------------------------------------------
# INCLUÍDO (20/10/2026): parâmetros das regras de negócio (classe config.ParametrosSistema).
# Os valores marcados como PROVISÓRIO vêm de regras que a planilha FENIX_REGRAS_DE_NEGOCIO marca como Confirmada,
# mas cujo trecho entre colchetes [ ] não foi preenchido. Troque aqui quando a Fênix ou o grupo definir.
# ---------------------------------------------------------------------------------------------------------------

# RN-CLI-09 e RN-OS-16: escala de prioridade do cliente e da OS. DEFINIDO pela Fênix em 22/10/2026: 0 a 100.
# A prioridade do cliente é calculada pelo sistema: maior faturamento = maior prioridade (PrioridadeClienteService).
fenix.prioridade.minima=0
fenix.prioridade.maxima=100

# RN-ITE-17: lista fechada de unidades do item (gravadas em maiúsculas). DEFINIDO pela Fênix em 22/10/2026:
# Peça, Conjunto, kg, Metro, Jogo. A unidade tem no máximo 10 caracteres (coluna Itens.unidade).
# Atenção: o application.properties é lido em ISO-8859-1, por isso o Ç está escrito como \u00C7 (PE\u00C7A = PEÇA).
fenix.itens.unidades=PE\u00C7A,CONJUNTO,KG,METRO,JOGO

# RN-USU-08: senhas erradas seguidas antes de bloquear o login, e por quantos minutos. PROVISÓRIO: 5 e 15.
fenix.login.max-tentativas=5
fenix.login.bloqueio-minutos=15

# RN-FOT-01: pasta do servidor onde ficam os arquivos das fotos (o banco guarda só o caminho relativo).
fenix.fotos.diretorio=fotos
# RN-FOT-02 e RN-FOT-06 (decisão de 20/10): até 10 fotos por item, de até 10 MB cada.
fenix.fotos.max-por-item=10
fenix.fotos.tamanho-maximo-mb=10
# RN-FOT-09: a foto é gravada com no máximo 1920 px no lado maior, em JPG com qualidade 80%.
fenix.fotos.lado-maximo-px=1920
fenix.fotos.qualidade-jpg=0.8

# Endereços do front que podem chamar a API pelo navegador (CORS), separados por vírgula.
# Acrescente aqui o endereço do app gerado no Lovable.
fenix.cors.origens=http://localhost:5173,http://localhost:8080

# INCLUÍDO (20/10/2026): RN-FOT-06. O padrão do Spring é 1 MB por arquivo, o que recusaria fotos de celular antes de
# chegarem ao Service. max-request-size deve ser maior se o front enviar várias fotos na mesma requisição.
spring.servlet.multipart.max-file-size=10MB
# ALTERADO (21/10/2026): era 10MB. A requisição de envio leva, além do arquivo, os cabeçalhos do formulário; com o
# mesmo limite do arquivo, uma foto de quase 10 MB seria recusada antes de chegar ao Service.
spring.servlet.multipart.max-request-size=11MB

# Observação sobre a D2 do cronograma (data_hora dos históricos, que é datetime e faz parte da chave):
# o StatusService grava a hora truncada em segundos, valor que o datetime guarda sem arredondar. Por isso a chave do
# objeto Java é igual à gravada e não é preciso acrescentar datetimeParameterType=datetime na URL acima.
