spring.application.name=projetoextensao

# create database banco_fenix
spring.jpa.open-in-view=true

# Configurações do banco de dados SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=banco_fenix;encrypt=true;trustServerCertificate=true;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=dbadba

# valida as tabelas do banco de dados
spring.jpa.hibernate.ddl-auto=validate

# reescreve os nomes em snake_case (OrdensDeServico vira ordens_de_servico), e 11 tabelas do script deixariam
# de ser encontradas.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Se você também estiver servindo páginas web, pode querer configurar o filtro de codificação de caracteres
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true